name: Telegram Günlük Bildirim Botu

on:
  schedule:
    # Türkiye Saati ile 06:45 (03:45 UTC) - GitHub kuyruk ertelemesiyle 07:00 civarında atar
    - cron: '45 3 * * *'
  workflow_dispatch: # GitHub web arayüzünden el ile tetikleme butonu

permissions:
  contents: write # Repoya config.json güncellemesi push edebilmek için izin

jobs:
  run-daily-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Config Dosyasını Güvenli Oluştur
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import json, os

          default_config = {
              'telegram': {
                  'bot_token': os.environ.get('TELEGRAM_BOT_TOKEN', 'YOUR_TELEGRAM_BOT_TOKEN_HERE'),
                  'chat_id': os.environ.get('TELEGRAM_CHAT_ID', 'YOUR_TELEGRAM_CHAT_ID_HERE')
              },
              'motorcycle': {
                  'daily_km': 30,
                  'remaining_km': 900,
                  'target_km': 900,
                  'last_update_date': ''
              },
              'location': {
                  'city': 'Istanbul',
                  'district': 'Silivri',
                  'latitude': 41.0744,
                  'longitude': 28.2481
              },
              'real_estate': {
                  'max_price': 1400000,
                  'location_keyword': 'Silivri'
              }
          }

          if os.path.exists('config.json'):
              with open('config.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
          else:
              data = default_config

          if os.environ.get('TELEGRAM_BOT_TOKEN'):
              data['telegram']['bot_token'] = os.environ['TELEGRAM_BOT_TOKEN']
          if os.environ.get('TELEGRAM_CHAT_ID'):
              data['telegram']['chat_id'] = os.environ['TELEGRAM_CHAT_ID']

          with open('config.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
          print('Config dosyasi hazirlandi.')
          "

      - name: Günlük Bildirimi Çalıştır ve Telegram'a Gönder
        run: python main.py --now

      - name: Motosiklet Km Durumunu Güncelle (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: Motosiklet km durumu güncellendi [skip ci]"
            git push || echo "Push izni veya durum yok."
          else
            echo "Değişiklik yok."
          fi
